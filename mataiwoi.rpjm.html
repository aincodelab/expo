<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPJMDesa Mataiwoi 2000–2028</title>
<style>
  :root{
    --text:#e8f5ef;
    --muted:#8fb0a5;

    --sec:#38bdf8;
    --sec-2:#6366f1;

    --visi-c1:#2fd08a;
    --visi-c2:#29b6d8;

    --level-misi:#2fd08a;
    --level-tujuan:#38bdf8;
    --level-sasaran:#a78bfa;

    --panel-bg:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
    --panel-border:rgba(255,255,255,.10);
    --bg-1:#04120d;
    --bg-2:#061a14;
    --bg-3:#04100f;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%;background:var(--bg-1)}

  body{
    font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color:var(--text);
    height:100vh;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:clamp(8px,1.1vh,14px);
    padding:clamp(10px,1.4vh,22px) clamp(14px,1.9vw,38px);
    background:
      radial-gradient(1200px 620px at 10% -14%, rgba(47,208,138,.20), transparent 62%),
      radial-gradient(1000px 520px at 110% 114%, rgba(41,182,216,.16), transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    -webkit-font-smoothing:antialiased;
  }

  .flash{
    position:fixed; inset:0; z-index:99; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 0%, var(--sec), transparent 68%);
  }
  .flash.on{animation:flashPulse .85s ease-out}
  @keyframes flashPulse{
    0%{opacity:0}
    22%{opacity:.18}
    100%{opacity:0}
  }

  /* ================= LOADING OVERLAY ================= */
  .loading-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(4,18,13,.94);
    backdrop-filter:blur(10px);
    display:grid; place-items:center;
    opacity:0; pointer-events:none;
    transition:opacity .4s ease;
  }
  .loading-overlay.show{opacity:1; pointer-events:auto}

  .loader-content{
    display:flex; flex-direction:column; align-items:center;
    gap:26px; padding:40px; max-width:560px; text-align:center;
  }

  .loader-ring{
    width:64px; height:64px;
    border:4px solid rgba(47,208,138,.20);
    border-top-color:var(--visi-c1);
    border-right-color:var(--visi-c1);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to { transform:rotate(360deg); } }

  .loader-text{
    font-size:clamp(14px,1.8vh,18px);
    color:var(--text); line-height:1.6; font-weight:500;
  }

  .loading-overlay.error .loader-text{
    color:#fca5a5;
    font-size:clamp(13px,1.65vh,16px);
  }

  .retry-btn{
    padding:11px 28px;
    background:linear-gradient(135deg, var(--visi-c1), var(--visi-c2));
    color:#05140f; border:none; border-radius:99px;
    font-size:clamp(12px,1.55vh,15px);
    font-weight:800; letter-spacing:.08em;
    cursor:pointer; transition:.25s ease;
    font-family:inherit;
    display:none;
  }
  .retry-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(47,208,138,.45);
  }

  /* ================= HEADER ================= */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex:none;
    padding:clamp(8px,1.15vh,15px) clamp(14px,1.5vw,24px);
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:18px;
    backdrop-filter:blur(8px);
    position:relative;overflow:hidden;
  }
  .topbar::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg, var(--visi-c1), var(--visi-c2));
  }

  .brand{display:flex;align-items:center;gap:clamp(10px,1.1vw,18px);min-width:0}

  .logo-wrap{
    position:relative;
    width:clamp(46px,5.8vh,72px);
    height:clamp(46px,5.8vh,72px);
    flex:none;
    display:grid;place-items:center;
    animation:logoIn 1.2s cubic-bezier(.22,.9,.3,1) both;
  }
  @keyframes logoIn{
    from{opacity:0;transform:scale(.65) rotate(-10deg);filter:blur(6px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }
  .logo-img{
    width:100%;height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 12px rgba(47,208,138,.45));
    animation:logoGlow 4.5s ease-in-out 1.2s infinite;
  }
  @keyframes logoGlow{
    0%,100%{filter:drop-shadow(0 0 10px rgba(47,208,138,.30))}
    50%    {filter:drop-shadow(0 0 22px rgba(47,208,138,.65))}
  }

  .titles{min-width:0}
  .titles h1{
    font-size:clamp(15px,2.4vh,30px);
    letter-spacing:.13em;font-weight:800;line-height:1.12;
    background:linear-gradient(90deg,#ffffff, var(--visi-c1) 58%, var(--visi-c2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;
  }
  .titles p{
    font-size:clamp(9px,1.15vh,13px);
    color:var(--muted);letter-spacing:.06em;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .topbar-right{display:flex;align-items:center;gap:clamp(10px,1.3vw,20px);flex:none}
  .clockbox{text-align:right}
  .clock{
    font-size:clamp(16px,2.6vh,32px);font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:.05em;
    color:#fff;line-height:1;
    text-shadow:0 0 20px rgba(47,208,138,.45);
  }
  .date{font-size:clamp(9px,1.1vh,12px);color:var(--muted);letter-spacing:.05em;margin-top:4px}

  .live{
    display:flex;align-items:center;gap:7px;
    font-size:clamp(9px,1.05vh,11.5px);letter-spacing:.16em;font-weight:700;
    color:var(--visi-c1);
    background:rgba(47,208,138,.10);
    border:1px solid rgba(47,208,138,.32);
    padding:7px 13px;border-radius:99px;
  }
  .live .dot{
    width:8px;height:8px;border-radius:50%;background:var(--visi-c1);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(47,208,138,.65)}
    70%{box-shadow:0 0 0 10px transparent}
    100%{box-shadow:0 0 0 0 transparent}
  }

  .fs-btn{
    width:clamp(34px,4.2vh,46px);height:clamp(34px,4.2vh,46px);
    flex:none;border-radius:12px;display:grid;place-items:center;
    background:rgba(255,255,255,.05);
    border:1px solid var(--panel-border);
    color:var(--muted);cursor:pointer;transition:.3s ease;
  }
  .fs-btn:hover{
    color:#fff;border-color:rgba(47,208,138,.55);
    background:rgba(47,208,138,.15);
  }
  .fs-btn.active{
    color:#05140f;background:var(--visi-c1);border-color:transparent;
    box-shadow:0 0 18px rgba(47,208,138,.45);
  }
  .fs-btn svg{width:52%;height:52%;stroke:currentColor;fill:none;stroke-width:2.1;
              stroke-linecap:round;stroke-linejoin:round}

  /* ================= LAYOUT ================= */
  .main{
    flex:1;min-height:0;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:clamp(8px,1.1vh,14px);
  }

  /* ---------- VISI (MARQUEE) ---------- */
  .visi-card{
    flex:none;position:relative;overflow:hidden;
    padding:clamp(14px,2.1vh,26px) clamp(18px,2.2vw,40px) clamp(10px,1.4vh,18px);
    border-radius:18px;
    text-align:center;
    background:
      linear-gradient(135deg,
        rgba(47,208,138,.14) 0%,
        rgba(41,182,216,.08) 55%,
        rgba(255,255,255,.02) 100%),
      var(--panel-bg);
    border:1px solid rgba(47,208,138,.32);
    box-shadow:0 0 40px rgba(47,208,138,.10);
  }
  .visi-card::after{
    content:"";position:absolute;right:-80px;top:-80px;
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, var(--visi-c2) 0%, transparent 70%);
    opacity:.14;pointer-events:none;
  }

  .visi-head{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(8px,.9vw,14px);
    margin-bottom:clamp(6px,1vh,12px);
    position:relative;z-index:2;
  }
  .visi-head .line{
    height:1px;flex:0 1 auto;
    width:clamp(24px,8vw,140px);
    background:linear-gradient(90deg, transparent, rgba(47,208,138,.55));
  }
  .visi-head .line:last-child{
    background:linear-gradient(90deg, rgba(47,208,138,.55), transparent);
  }
  .visi-head h2{
    font-size:clamp(11px,1.6vh,17px);
    letter-spacing:.28em;font-weight:900;text-transform:uppercase;
    color:var(--visi-c1);
    white-space:nowrap;
  }

  .visi-scroll{
    position:relative;
    overflow:hidden;
    margin:0 auto;
    padding:clamp(6px,1vh,12px) 0;
    -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    z-index:2;
    min-height:clamp(30px,4.2vh,54px);
  }

  .visi-track{
    display:flex;
    width:max-content;
    animation:visiMarquee 55s linear infinite;
    will-change:transform;
  }

  .visi-track .visi-item{
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
    padding-right:120px;
    font-size:clamp(20px,3.2vh,40px);
    font-weight:700;
    line-height:1.25;
    letter-spacing:.02em;
    color:#eafff7;
    text-shadow:0 0 30px rgba(47,208,138,.15);
  }

  .visi-track .hl{
    color:var(--visi-c1);
    font-weight:900;
    text-shadow:0 0 26px rgba(47,208,138,.55);
    margin:0 4px;
  }

  @keyframes visiMarquee{
    to{transform:translateX(-50%)}
  }

  .visi-foot{
    position:relative;z-index:2;
    margin-top:clamp(6px,1vh,12px);
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:clamp(8px,1.05vh,11.5px);
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .visi-foot::before,.visi-foot::after{
    content:"";height:1px;flex:none;
    width:clamp(20px,3vw,50px);
    background:linear-gradient(90deg, transparent, var(--visi-c1), transparent);
  }

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;gap:clamp(6px,.8vw,12px);
    position:relative;padding-bottom:6px;flex:none;
  }
  .tab{
    flex:1;font-family:inherit;
    font-size:clamp(12px,1.7vh,19px);
    font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
    background:rgba(255,255,255,.035);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:clamp(7px,1.05vh,13px) 8px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:.45s cubic-bezier(.22,.9,.3,1);
  }
  .tab:hover{
    color:#fff;
    border-color:color-mix(in srgb, var(--sec) 40%, transparent);
    background:color-mix(in srgb, var(--sec) 9%, transparent);
  }
  .tab.active{
    color:#05140f;
    background:linear-gradient(135deg, var(--sec), var(--sec-2));
    border-color:transparent;
    box-shadow:0 8px 24px color-mix(in srgb, var(--sec) 30%, transparent);
    transform:translateY(-1px);
  }
  .tab-progress{
    position:absolute;left:0;right:0;bottom:0;height:3px;
    background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;
  }
  .tab-progress span{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg, var(--sec), var(--sec-2));
    box-shadow:0 0 10px color-mix(in srgb, var(--sec) 75%, transparent);
    transition:none;
  }

  /* ---------- PANELS ---------- */
  .panels{flex:1;min-height:0;position:relative}

  .panel{
    position:absolute;inset:0;
    overflow:hidden;
    padding:clamp(14px,2vh,26px) clamp(16px,1.8vw,30px);
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:18px;
    backdrop-filter:blur(8px);
    opacity:0;transform:translateY(14px) scale(.995);
    pointer-events:none;
    transition:opacity .65s ease, transform .65s cubic-bezier(.22,.9,.3,1);
  }
  .panel.active{opacity:1;transform:none;pointer-events:auto}
  .panel::-webkit-scrollbar{display:none;width:0}

  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;height:100%;color:var(--muted);
    font-size:clamp(13px,1.75vh,17px);text-align:center;
  }
  .empty-state strong{color:var(--text);font-size:clamp(15px,2vh,20px)}

  /* ================= GRID 2 KOLOM ================= */
  .card-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:clamp(12px, 1.6vh, 22px);
    align-content:start;
    align-items:start;
  }
  .group-head{grid-column:1 / -1}

  /* ================= CARD ITEMS ================= */
  .misi-card,.tujuan-card,.sasaran-card{
    display:flex;
    gap:clamp(14px,1.4vw,20px);
    padding:clamp(14px,1.9vh,22px) clamp(16px,1.6vw,24px);
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    opacity:0;
    transition:
      opacity 1s ease,
      background-color .4s ease,
      border-color .4s ease,
      box-shadow .4s ease;
    pointer-events:none;
    will-change:opacity;
    min-width:0;
  }
  .misi-card.visible,.tujuan-card.visible,.sasaran-card.visible{
    opacity:1;pointer-events:auto;
  }

  /* ---------- MISI ---------- */
  .misi-card{border-left:4px solid var(--level-misi)}
  .misi-card.visible:hover{
    background:color-mix(in srgb, var(--level-misi) 7%, transparent);
    border-color:color-mix(in srgb, var(--level-misi) 28%, transparent);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .misi-badge{
    flex:none;
    width:clamp(50px,6.2vh,70px);height:clamp(50px,6.2vh,70px);
    display:grid;place-items:center;
    font-size:clamp(22px,3vh,34px);font-weight:900;
    color:#05140f;
    border-radius:14px;
    background:linear-gradient(135deg, var(--level-misi), var(--visi-c2));
    box-shadow:0 0 22px rgba(47,208,138,.35);
    font-variant-numeric:tabular-nums;
  }
  .misi-body{flex:1;min-width:0}

  /* ---------- TUJUAN ---------- */
  .tujuan-card{border-left:4px solid var(--level-tujuan)}
  .tujuan-card.visible:hover{
    background:color-mix(in srgb, var(--level-tujuan) 7%, transparent);
    border-color:color-mix(in srgb, var(--level-tujuan) 28%, transparent);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .tujuan-badge{
    flex:none;
    width:clamp(50px,6.2vh,70px);height:clamp(50px,6.2vh,70px);
    display:grid;place-items:center;
    font-size:clamp(16px,2.3vh,26px);font-weight:900;
    color:#05140f;
    border-radius:14px;
    background:linear-gradient(135deg, var(--level-tujuan), var(--sec-2));
    box-shadow:0 0 22px rgba(56,189,248,.35);
    font-variant-numeric:tabular-nums;
  }
  .tujuan-body{flex:1;min-width:0}

  /* ---------- SASARAN ---------- */
  .sasaran-card{border-left:4px solid var(--level-sasaran)}
  .sasaran-card.visible:hover{
    background:color-mix(in srgb, var(--level-sasaran) 7%, transparent);
    border-color:color-mix(in srgb, var(--level-sasaran) 28%, transparent);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .sasaran-badge{
    flex:none;
    width:clamp(64px,7.5vh,90px);
    height:clamp(50px,6.2vh,70px);
    display:grid;place-items:center;
    font-size:clamp(14px,1.9vh,22px);font-weight:900;
    color:#05140f;
    border-radius:14px;
    background:linear-gradient(135deg, var(--level-sasaran), #8b5cf6);
    box-shadow:0 0 22px rgba(167,139,250,.35);
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
    padding:0 6px;
  }
  .sasaran-body{flex:1;min-width:0}

  /* ---------- SHARED BODY ---------- */
  .level-label{
    font-size:clamp(11px,1.5vh,16px);
    letter-spacing:.22em;font-weight:800;text-transform:uppercase;
    margin-bottom:8px;
  }
  .misi-body .level-label{color:var(--level-misi)}
  .tujuan-body .level-label{color:var(--level-tujuan)}
  .sasaran-body .level-label{color:var(--level-sasaran)}

  .item-text{
    font-size:clamp(15px,2.15vh,24px);
    line-height:1.55;color:#eafff7;font-weight:500;
  }

  .sub-refs{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    margin-top:clamp(10px,1.3vh,14px);
  }
  .sub-label{
    color:var(--muted);font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    margin-right:3px;
    font-size:clamp(10px,1.25vh,13px);
  }
  .ref-chip{
    padding:5px 13px;border-radius:99px;
    font-weight:800;font-variant-numeric:tabular-nums;
    font-size:clamp(11px,1.4vh,15px);
    letter-spacing:.03em;
    transition:.3s ease;
  }
  .tujuan-ref{
    background:rgba(56,189,248,.14);
    border:1px solid rgba(56,189,248,.42);
    color:#7dd3fc;
  }
  .sasaran-ref{
    background:rgba(167,139,250,.14);
    border:1px solid rgba(167,139,250,.42);
    color:#c4b5fd;
  }

  /* ---------- INDICATOR ---------- */
  .indikator{
    margin-top:clamp(10px,1.3vh,14px);
    padding:clamp(9px,1.2vh,13px) clamp(12px,1.2vw,17px);
    background:rgba(167,139,250,.06);
    border:1px dashed rgba(167,139,250,.32);
    border-radius:10px;
    font-size:clamp(12px,1.6vh,17px);
    line-height:1.5;color:#d4c5f5;
  }
  .ind-label{
    color:var(--level-sasaran);
    font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    font-size:.86em;
    margin-right:6px;
  }

  /* ================= GROUP HEAD ================= */
  .group-head{
    display:flex;align-items:center;gap:12px;
    padding-bottom:clamp(8px,1.1vh,12px);
    margin-top:clamp(4px,.5vh,8px);
    border-bottom:1px dashed rgba(255,255,255,.10);
  }
  .group-head:first-child{margin-top:0}
  .group-badge{
    flex:none;
    font-size:clamp(11px,1.4vh,15px);
    font-weight:900;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 15px;border-radius:99px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .group-badge.misi{
    background:rgba(47,208,138,.16);
    border:1px solid rgba(47,208,138,.42);
    color:var(--level-misi);
  }
  .group-badge.tujuan{
    background:rgba(56,189,248,.16);
    border:1px solid rgba(56,189,248,.42);
    color:var(--level-tujuan);
  }
  .group-title{
    font-size:clamp(12px,1.55vh,16px);
    color:#b8d8cc;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;min-width:0;
  }

  /* ================= TICKER BAWAH ================= */
  .ticker{
    position:relative;overflow:hidden;border-radius:12px;flex:none;
    background:rgba(255,255,255,.04);
    border:1px solid var(--panel-border);
    padding:clamp(5px,.85vh,10px) 0;
  }
  .ticker::before,.ticker::after{
    content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none;
  }
  .ticker::before{left:0;background:linear-gradient(90deg, var(--bg-1), transparent)}
  .ticker::after{right:0;background:linear-gradient(270deg, var(--bg-1), transparent)}
  .ticker-track{display:flex;width:max-content;animation:marquee 75s linear infinite}
  .ticker-track span{
    font-size:clamp(9px,1.05vh,12px);letter-spacing:.05em;
    color:#b8d8cc;padding-right:60px;white-space:nowrap;
  }
  .ticker-track b{color:var(--visi-c1);font-weight:800}
  @keyframes marquee{to{transform:translateX(-50%)}}

  /* ================= RESPONSIF ================= */
  @media (max-width: 1000px){
    body{height:auto;min-height:100dvh;overflow-y:auto}
    .panels{min-height:520px}
    .panel{position:relative;inset:auto;display:none;overflow:hidden}
    .panel.active{display:block}
  }
  @media (max-width: 900px){
    .card-grid{grid-template-columns:1fr}
  }
  @media (max-width: 620px){
    .titles h1{white-space:normal;font-size:15px}

<script>
/* =========================================================
   0. KONFIGURASI — GANTI DENGAN URL WEB APP ANDA
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycby0qFxFGyfX7bfoyWGbIvCyvfP7PWiBh4SIRunE5i_uB2dPyAOkjULWs7cGh_Evz_qC/exec';

/* =========================================================
   1. STATE & UTIL
   ========================================================= */
let VISI_DATA = null;
let MISI_DATA = [];

let activeTab     = "misi";
let currentAnimId = 0;
let progressRaf   = null;
let hasStarted    = false;

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeRegex(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function str(v) {
  return String(v == null ? '' : v).trim();
}

/* =========================================================
   2. LOADING / ERROR OVERLAY
   ========================================================= */
function showLoading(text) {
  const ov   = $('loadingOverlay');
  const ring = $('loaderRing');
  const txt  = $('loaderText');
  const btn  = $('retryBtn');
  ov.classList.add('show');
  ov.classList.remove('error');
  ring.style.display = 'block';
  txt.textContent = text || 'Memuat data RPJMDesa…';
  btn.style.display = 'none';
}

function showError(msg) {
  const ov   = $('loadingOverlay');
  const ring = $('loaderRing');
  const txt  = $('loaderText');
  const btn  = $('retryBtn');
  ov.classList.add('show');
  ov.classList.add('error');
  ring.style.display = 'none';
  txt.textContent = msg;
  btn.style.display = 'inline-block';
}

function hideLoading() {
  $('loadingOverlay').classList.remove('show');
}

/* =========================================================
   3. LOAD DATA DARI API
   ========================================================= */
async function loadData() {
  if (!API_URL || API_URL.indexOf('GANTI_') === 0) {
    throw new Error('API_URL belum diisi. Buka file HTML dan ganti konstanta API_URL dengan URL Web App Google Apps Script Anda (diakhiri /exec).');
  }

  const sep = API_URL.indexOf('?') >= 0 ? '&' : '?';
  const url = API_URL + sep + 'action=all&_=' + Date.now();

  const res = await fetch(url, {
    method: 'GET',
    cache: 'no-store',
    redirect: 'follow'
  });

  if (!res.ok) {
    throw new Error('Server membalas HTTP ' + res.status + '. Periksa kembali deployment Web App.');
  }

  let json;
  try { json = await res.json(); }
  catch (e) {
    throw new Error('Respons bukan JSON. Pastikan deployment Web App benar dan tidak ada halaman error login.');
  }

  if (!json || json.ok !== true) {
    throw new Error((json && json.error) ? String(json.error) : 'API tidak mengembalikan status ok.');
  }

  const data = json.data || {};
  VISI_DATA = data.visi || { teks: '', highlight: [], foot: '' };
  MISI_DATA = Array.isArray(data.misi) ? data.misi : [];

  /* Normalisasi & trim semua teks */
  VISI_DATA.teks      = str(VISI_DATA.teks);
  VISI_DATA.foot      = str(VISI_DATA.foot);
  VISI_DATA.highlight = (VISI_DATA.highlight || []).map(str).filter(Boolean);

  MISI_DATA = MISI_DATA.map(function (m) {
    return {
      no:   (typeof m.no === 'number' ? m.no : str(m.no)),
      teks: str(m.teks),
      tujuan: (m.tujuan || []).map(function (t) {
        return {
          no:   str(t.no),
          teks: str(t.teks),
          sasaran: (t.sasaran || []).map(function (s) {
            return {
              no:        str(s.no),
              teks:      str(s.teks),
              indikator: str(s.indikator)
            };
          })
        };
      })
    };
  });

  return json;
}

/* =========================================================
   4. RENDER: VISI (MARQUEE)
   ========================================================= */
function buildVisiHTML() {
  if (!VISI_DATA || !VISI_DATA.teks) return '';
  const text       = VISI_DATA.teks;
  const highlights = VISI_DATA.highlight || [];

  if (!highlights.length) return escapeHTML(text);

  const sorted  = highlights.slice().sort(function (a,b){ return b.length - a.length; });
  const pattern = sorted.map(escapeRegex).join('|');
  const re      = new RegExp('(' + pattern + ')', 'gi');
  const parts   = text.split(re);

  return parts.map(function (part, i) {
    if (i % 2 === 1) {
      return '<b class="hl">' + escapeHTML(part) + '</b>';
    }
    return escapeHTML(part);
  }).join('');
}

function renderVisi() {
  const track = $('visiTrack');
  const foot  = $('visiFoot');

  if (!VISI_DATA || !VISI_DATA.teks) {
    track.innerHTML = '';
    if (foot) foot.textContent = 'Visi Pembangunan Desa 2000 – 2028';
    return;
  }

  const itemHTML = buildVisiHTML();
  /* Duplikat 2× agar loop mulus */
  track.innerHTML =
    '<span class="visi-item">' + itemHTML + '</span>' +
    '<span class="visi-item">' + itemHTML + '</span>';

  if (foot) {
    foot.textContent = VISI_DATA.foot || 'Visi Pembangunan Desa 2000 – 2028';
  }
}

/* =========================================================
   5. RENDER: MISI / TUJUAN / SASARAN
   ========================================================= */
function renderMisi() {
  if (!MISI_DATA.length) {
    $('misiGrid').innerHTML = emptyState('Belum ada data Misi pada spreadsheet.');
    return;
  }
  $('misiGrid').innerHTML = MISI_DATA.map(function (m) {
    const tujuanRefs = (m.tujuan || []).map(function (t) {
      return '<span class="ref-chip tujuan-ref">' + escapeHTML(t.no) + '</span>';
    }).join('');
    return (
      '<article class="misi-card">' +
        '<div class="misi-badge">' + escapeHTML(String(m.no)) + '</div>' +
        '<div class="misi-body">' +
          '<div class="level-label">Misi ' + escapeHTML(String(m.no)) + '</div>' +
          '<p class="item-text">' + escapeHTML(m.teks) + '</p>' +
          (tujuanRefs ? (
            '<div class="sub-refs">' +
              '<span class="sub-label">Tujuan</span>' + tujuanRefs +
            '</div>'
          ) : '') +
        '</div>' +
      '</article>'
    );
  }).join('');
}

function renderTujuan() {
  if (!MISI_DATA.length) {
    $('tujuanGrid').innerHTML = emptyState('Belum ada data Tujuan pada spreadsheet.');
    return;
  }
  const parts = [];
  MISI_DATA.forEach(function (m) {
    parts.push(
      '<div class="group-head">' +
        '<span class="group-badge misi">Misi ' + escapeHTML(String(m.no)) + '</span>' +
        '<span class="group-title" title="' + escapeHTML(m.teks) + '">' + escapeHTML(m.teks) + '</span>' +
      '</div>'
    );
    (m.tujuan || []).forEach(function (t) {
      const sasaranRefs = (t.sasaran || []).map(function (s) {
        return '<span class="ref-chip sasaran-ref">' + escapeHTML(s.no) + '</span>';
      }).join('');
      parts.push(
        '<article class="tujuan-card">' +
          '<div class="tujuan-badge">' + escapeHTML(t.no) + '</div>' +
          '<div class="tujuan-body">' +
            '<div class="level-label">Tujuan ' + escapeHTML(t.no) + '</div>' +
            '<p class="item-text">' + escapeHTML(t.teks) + '</p>' +
            (sasaranRefs ? (
              '<div class="sub-refs">' +
                '<span class="sub-label">Sasaran</span>' + sasaranRefs +
              '</div>'
            ) : '') +
          '</div>' +
        '</article>'
      );
    });
  });
  $('tujuanGrid').innerHTML = parts.join('');
}

function renderSasaran() {
  if (!MISI_DATA.length) {
    $('sasaranGrid').innerHTML = emptyState('Belum ada data Sasaran pada spreadsheet.');
    return;
  }
  const parts = [];
  MISI_DATA.forEach(function (m) {
    (m.tujuan || []).forEach(function (t) {
      parts.push(
        '<div class="group-head">' +
          '<span class="group-badge tujuan">Tujuan ' + escapeHTML(t.no) + '</span>' +
          '<span class="group-title" title="' + escapeHTML(t.teks) + '">' + escapeHTML(t.teks) + '</span>' +
        '</div>'
      );
      (t.sasaran || []).forEach(function (s) {
        parts.push(
          '<article class="sasaran-card">' +
            '<div class="sasaran-badge">' + escapeHTML(s.no) + '</div>' +
            '<div class="sasaran-body">' +
              '<div class="level-label">Sasaran ' + escapeHTML(s.no) + '</div>' +
              '<p class="item-text">' + escapeHTML(s.teks) + '</p>' +
              (s.indikator ? (
                '<div class="indikator">' +
                  '<span class="ind-label">Indikator</span>' +
                  escapeHTML(s.indikator) +
                '</div>'
              ) : '') +
            '</div>' +
          '</article>'
        );
      });
    });
  });
  $('sasaranGrid').innerHTML = parts.join('');
}

function emptyState(msg) {
  return '<div class="empty-state" style="grid-column:1 / -1;">' +
           '<strong>Data Tidak Tersedia</strong>' +
           '<span>' + escapeHTML(msg) + '</span>' +
         '</div>';
}

/* =========================================================
   6. PROGRESS BAR
   ========================================================= */
function startProgress(totalDuration) {
  if (progressRaf) { cancelAnimationFrame(progressRaf); progressRaf = null; }
  const progress = $('tabProgress');
  progress.style.transition = 'none';
  progress.style.width = '0%';

  const startTime = performance.now();
  const animId = currentAnimId;

  function tick() {
    if (animId !== currentAnimId) return;
    const elapsed = performance.now() - startTime;
    const pct = Math.min(100, (elapsed / totalDuration) * 100);
    progress.style.width = pct + '%';
    if (pct < 100) progressRaf = requestAnimationFrame(tick);
  }
  progressRaf = requestAnimationFrame(tick);
}

function stopProgress() {
  if (progressRaf) { cancelAnimationFrame(progressRaf); progressRaf = null; }
}

/* =========================================================
   7. TAB CONFIG
   ========================================================= */
const TAB_THEMES = {
  misi:    { c1:"#2fd08a", c2:"#29b6d8" },
  tujuan:  { c1:"#38bdf8", c2:"#6366f1" },
  sasaran: { c1:"#a78bfa", c2:"#8b5cf6" }
};

const TAB_CONFIG = {
  misi:    { selector: ".misi-card",    stagger: 900, hold: 2400 },
  tujuan:  { selector: ".tujuan-card",  stagger: 700, hold: 2200 },
  sasaran: { selector: ".sasaran-card", stagger: 600, hold: 2000 }
};

const TABS = ["misi", "tujuan", "sasaran"];

/* =========================================================
   8. PAGINASI
   ========================================================= */
function buildUnits(elements) {
  const units = [];
  let pendingCard = null;

  for (const el of elements) {
    const isHead = el.classList.contains('group-head');
    const h = el.offsetHeight + 14;

    if (isHead) {
      if (pendingCard) {
        units.push({ type: 'row', cards: [pendingCard], height: pendingCard.height });
        pendingCard = null;
      }
      units.push({ type: 'head', el, height: h });
    } else {
      const card = { el, height: h };
      if (pendingCard) {
        units.push({
          type: 'row',
          cards: [pendingCard, card],
          height: Math.max(pendingCard.height, card.height)
        });
        pendingCard = null;
      } else {
        pendingCard = card;
      }
    }
  }
  if (pendingCard) units.push({ type: 'row', cards: [pendingCard], height: pendingCard.height });
  return units;
}

function paginate(units, maxHeight) {
  const pages = [];
  let currentPage = [];
  let currentHeight = 0;

  for (let i = 0; i < units.length; i++) {
    const u = units[i];

    if (u.type === 'head') {
      const next = units[i + 1];
      const needed = u.height + (next ? next.height : 0);
      if (currentHeight + needed > maxHeight && currentPage.length > 0) {
        pages.push(currentPage);
        currentPage = [];
        currentHeight = 0;
      }
    } else {
      if (currentHeight + u.height > maxHeight && currentPage.length > 0) {
        pages.push(currentPage);
        currentPage = [];
        currentHeight = 0;
      }
    }
    currentPage.push(u);
    currentHeight += u.height;
  }
  if (currentPage.length) pages.push(currentPage);
  return pages;
}

/* =========================================================
   9. ANIMASI TAB
   ========================================================= */
async function playTabAnimation(name) {
  const animId = ++currentAnimId;
  stopProgress();

  const panel = document.querySelector('.panel[data-panel="' + name + '"]');
  const grid  = panel.querySelector('.card-grid');
  const cfg   = TAB_CONFIG[name];
  const stagger = cfg.stagger;
  const hold    = cfg.hold;

  const allEls = Array.from(grid.querySelectorAll('.group-head, .misi-card, .tujuan-card, .sasaran-card'));

  if (allEls.length === 0) {
    /* Tab kosong: lewati setelah 2 detik */
    await sleep(2000);
    if (animId !== currentAnimId) return;
    nextTab();
    return;
  }

  /* Reset */
  allEls.forEach(function (el) {
    el.classList.remove('visible');
    el.style.display = 'none';
    el.style.transition = 'none';
  });

  /* Show all untuk pengukuran */
  allEls.forEach(function (el) { el.style.display = 'flex'; });
  void panel.offsetHeight;
  await sleep(50);
  if (animId !== currentAnimId) return;

  /* Ukur tinggi panel */
  const pStyle = getComputedStyle(panel);
  const maxHeight = panel.clientHeight
    - parseFloat(pStyle.paddingTop)
    - parseFloat(pStyle.paddingBottom)
    - 20;

  const units = buildUnits(allEls);
  const pages = paginate(units, maxHeight);

  /* Kembalikan ke hidden */
  allEls.forEach(function (el) {
    el.style.display = 'none';
    el.style.transition = '';
  });

  if (pages.length === 0) { nextTab(); return; }

  /* Total durasi untuk progress bar */
  let totalDuration = 0;
  pages.forEach(function (page) {
    totalDuration += page.length * stagger + hold + 1000;
  });

  startProgress(totalDuration);

  for (const page of pages) {
    if (animId !== currentAnimId) return;

    /* Tampilkan elemen halaman (opacity 0) */
    page.forEach(function (u) {
      if (u.type === 'head') u.el.style.display = 'flex';
      else u.cards.forEach(function (c) { c.el.style.display = 'flex'; });
    });

    await sleep(30);
    if (animId !== currentAnimId) return;

    page.forEach(function (u) {
      if (u.type === 'head') u.el.classList.remove('visible');
      else u.cards.forEach(function (c) { c.el.classList.remove('visible'); });
    });
    void panel.offsetHeight;

    /* Fade-in satu per satu (kiri-kanan satu baris bersama) */
    for (const u of page) {
      if (animId !== currentAnimId) return;
      if (u.type === 'head') {
        u.el.classList.add('visible');
      } else {
        u.cards.forEach(function (c) { c.el.classList.add('visible'); });
      }
      await sleep(stagger);
    }

    /* Tahan */
    await sleep(hold);
    if (animId !== currentAnimId) return;

    /* Fade-out */
    page.forEach(function (u) {
      if (u.type === 'head') u.el.classList.remove('visible');
      else u.cards.forEach(function (c) { c.el.classList.remove('visible'); });
    });
    await sleep(1000);
    if (animId !== currentAnimId) return;

    /* Hide */
    page.forEach(function (u) {
      if (u.type === 'head') u.el.style.display = 'none';
      else u.cards.forEach(function (c) { c.el.style.display = 'none'; });
    });
  }

  if (animId !== currentAnimId) return;
  stopProgress();
  $('tabProgress').style.width = '100%';
  nextTab();
}

/* =========================================================
   10. TAB SWITCHING
   ========================================================= */
function pulseFlash() {
  const flash = $('flash');
  flash.classList.remove("on");
  void flash.offsetWidth;
  flash.classList.add("on");
}

function setTab(name) {
  activeTab = name;
  const t = TAB_THEMES[name];
  document.documentElement.style.setProperty("--sec",   t.c1);
  document.documentElement.style.setProperty("--sec-2", t.c2);

  document.querySelectorAll(".tab").forEach(function (b) {
    b.classList.toggle("active", b.dataset.tab === name);
  });
  document.querySelectorAll(".panel").forEach(function (p) {
    p.classList.toggle("active", p.dataset.panel === name);
  });

  pulseFlash();
  playTabAnimation(name);
}

function nextTab() {
  const i = TABS.indexOf(activeTab);
  setTab(TABS[(i + 1) % TABS.length]);
}

document.querySelectorAll(".tab").forEach(function (btn) {
  btn.addEventListener("click", function () { setTab(btn.dataset.tab); });
});

/* =========================================================
   11. FULLSCREEN
   ========================================================= */
const fsBtn = $("fsBtn");
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const p = req.call(el); if (p && p.catch) p.catch(function(){}); }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) { const p = exit.call(document); if (p && p.catch) p.catch(function(){}); }
  }
}
function updateFsBtn() {
  fsBtn.classList.toggle("active", isFullscreen());
  fsBtn.title = isFullscreen() ? "Keluar Layar Penuh (F)" : "Layar Penuh (F)";
}
fsBtn.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", updateFsBtn);
document.addEventListener("webkitfullscreenchange", updateFsBtn);

/* =========================================================
   12. KEYBOARD
   ========================================================= */
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight") { e.preventDefault(); nextTab(); }
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    const i = TABS.indexOf(activeTab);
    setTab(TABS[(i - 1 + TABS.length) % TABS.length]);
  }
  if (e.key === "f" || e.key === "F") { e.preventDefault(); toggleFullscreen(); }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 3) { e.preventDefault(); setTab(TABS[n - 1]); }
});

/* =========================================================
   13. JAM & TANGGAL
   ========================================================= */
const HARI  = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni",
               "Juli","Agustus","September","Oktober","November","Desember"];

function tickClock() {
  const now = new Date();
  const p2  = function (n) { return String(n).padStart(2,"0"); };
  $("clock").textContent =
    p2(now.getHours()) + ":" + p2(now.getMinutes()) + ":" + p2(now.getSeconds());
  $("date").textContent =
    HARI[now.getDay()] + ", " + now.getDate() + " " +
    BULAN[now.getMonth()] + " " + now.getFullYear();
}

/* =========================================================
   14. TICKER BAWAH
   ========================================================= */
function buildTicker() {
  const totalMisi    = MISI_DATA.length;
  const totalTujuan  = MISI_DATA.reduce(function (a,m) { return a + (m.tujuan||[]).length; }, 0);
  const totalSasaran = MISI_DATA.reduce(function (a,m) {
    return a + (m.tujuan||[]).reduce(function (b,t) { return b + (t.sasaran||[]).length; }, 0);
  }, 0);

  const visiShort = (VISI_DATA && VISI_DATA.highlight && VISI_DATA.highlight.length)
    ? VISI_DATA.highlight.join(' · ')
    : 'Maju · Mandiri · Sejahtera · Berbudaya';

  const text =
    "<span>📘 <b>RPJMDesa Desa Mataiwoi 2000 – 2028</b>" +
    " &nbsp;·&nbsp; Kecamatan Amonggedo, Kabupaten Konawe, Sulawesi Tenggara" +
    " &nbsp;·&nbsp; <b>Visi:</b> " + escapeHTML(visiShort) +
    " &nbsp;·&nbsp; <b>" + totalMisi + " Misi</b> · <b>" + totalTujuan + " Tujuan</b> · <b>" + totalSasaran + " Sasaran</b>" +
    " &nbsp;|&nbsp; Tekan <b>←</b> <b>→</b> untuk berpindah bagian, <b>1–3</b> pilih langsung, " +
    "<b>F</b> untuk layar penuh" +
    " &nbsp;|&nbsp; <i>Sumber: Google Spreadsheet (API)</i></span>";

  $("tickerTrack").innerHTML = text + text;
}

/* =========================================================
   15. INIT
   ========================================================= */
async function init() {
  if (hasStarted) {
    /* Retry: reset animasi yang berjalan */
    currentAnimId++;
    stopProgress();
  }

  showLoading('Memuat data RPJMDesa…');

  try {
    const json = await loadData();

    /* Render semua konten */
    renderVisi();
    renderMisi();
    renderTujuan();
    renderSasaran();
    buildTicker();

    /* Tunggu satu frame agar layout stabil sebelum mengukur tinggi */
    await sleep(120);
    hideLoading();

    hasStarted = true;
    setTab("misi");
  } catch (err) {
    console.error('[RPJMDesa] Gagal memuat data:', err);
    showError('Gagal memuat data dari server.\n\n' + (err && err.message ? err.message : 'Periksa koneksi dan pastikan API sudah di-deploy sebagai Web App dengan akses "Anyone".'));
  }
}

/* Retry button */
$('retryBtn').addEventListener('click', function () {
  init();
});

/* Jam mulai lebih awal */
tickClock();
setInterval(tickClock, 1000);

/* Mulai setelah dokumen siap */
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  requestAnimationFrame(init);
} else {
  window.addEventListener('DOMContentLoaded', function () {
    requestAnimationFrame(init);
  });
}
</script>
